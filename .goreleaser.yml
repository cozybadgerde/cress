version: 2

project_name: cress

release:
  github:
    owner: cozybadgerde
    name: cress

builds:
  - main: ./cmd/cress
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64

archives:
  - files:
      - LICENSE
      - readme.md
