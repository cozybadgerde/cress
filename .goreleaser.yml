version: 2

project_name: cress

before:
  hooks:
    - sh -c 'mkdir -p bin && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go-licenses report ./cmd/cress --template .github/notices.tpl > bin/THIRD-PARTY-NOTICES.txt'

release:
  prerelease: auto
  github:
    owner: cozybadgerde
    name: cress

builds:
  - main: ./cmd/cress
    flags:
      - -buildvcs=false
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64

archives:
  - files:
      - LICENSE
      - README.md
      - docs/THIRD-PARTY-NOTICES.md
      - docs/INSTALL.md
      - src: bin/THIRD-PARTY-NOTICES.txt
        strip_parent: true

sboms:
  - id: linux-amd64
    artifacts: any
    documents:
      - cress_{{ .Version }}_linux_amd64.licenses.csv
    cmd: sh
    args: &report-args
      - -c
      - 'go-licenses report ../cmd/cress > "$document"'
    env:
      - GOOS=linux
      - GOARCH=amd64
      - CGO_ENABLED=0
  - id: linux-arm64
    artifacts: any
    documents:
      - cress_{{ .Version }}_linux_arm64.licenses.csv
    cmd: sh
    args: *report-args
    env:
      - GOOS=linux
      - GOARCH=arm64
      - CGO_ENABLED=0
  - id: darwin-arm64
    artifacts: any
    documents:
      - cress_{{ .Version }}_darwin_arm64.licenses.csv
    cmd: sh
    args: *report-args
    env:
      - GOOS=darwin
      - GOARCH=arm64
      - CGO_ENABLED=0

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    output: true
