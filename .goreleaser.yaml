# https://goreleaser.com — release config for cress.
# Validate with `goreleaser check`; build locally with `task snapshot`.
version: 2

project_name: cress

before:
  hooks:
    - go mod tidy

builds:
  - id: cress
    main: ./cmd/cress
    binary: cress
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/cozybadgerde/cress/internal/version.Version={{ .Version }}

archives:
  - id: cress
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

release:
  # auto = flag the release as a prerelease when the tag has a semver suffix
  # (-alpha, -rc, …); a clean vX.Y.Z stays stable.
  prerelease: auto
  github:
    owner: cozybadgerde
    name: cress

checksum:
  name_template: checksums.txt

# Sign the checksum file, not each archive: every artifact is already covered by
# a SHA-256 in there, so one signature authenticates the whole release.
#
# The checksums alone cannot do that. They are published from the same release,
# over the same channel, as the files they attest, so they catch a corrupted
# download and not a substituted one. The signature is what ties a release to
# the workflow that built it.
#
# Keyless: cosign exchanges the job's OIDC token for a short-lived certificate
# and logs it to the Rekor transparency log, so there is no private key to store
# or rotate. Verification needs no key either, only the identity to expect.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature"
      - "${signature}"
      - "--output-certificate"
      - "${certificate}"
      - "${artifact}"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: git # build from git log; no forge API needed
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.*$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.*$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.*$'
      order: 2
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - '^refactor:'
      - '^Merge '
