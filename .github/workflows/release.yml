# .github/workflows/release.yml
# Publishes a GoReleaser release to GitHub on a version tag (vX.Y.Z).
# Release config lives in .goreleaser.yaml; validate it with `goreleaser check`.
#
# GITHUB_TOKEN is the automatic, repo-scoped token GitHub mints per job. A tag
# push carries the write access GoReleaser needs to create the release and
# upload assets, so no extra secret is required.
#
# Third-party actions are pinned to a commit rather than a tag. A major-version
# tag is a moving reference its owner can repoint at any time, and this is the
# one job holding a write token, so the code it runs should not be able to
# change without a commit here. The tag is kept in a comment so Dependabot can
# still propose updates.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Keyless signing exchanges this for a short-lived Sigstore certificate, so
  # no key material is stored in the repository.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history + tags, for the changelog

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.17.0        # pinned
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
