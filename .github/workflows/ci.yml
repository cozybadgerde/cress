# .github/workflows/ci.yml
#
# The check list and tool versions live in the Taskfile (single source). CI just
# installs Task plus the pinned tools and runs `task check`, so there is no
# second copy of "what green means" to drift out of sync. govulncheck is
# deliberately not part of this gate - it runs weekly in security.yml instead.

name: ci

on:
  push:
    branches: [trunk, main]
  pull_request:

# The job checks out the repository and runs tools over it, nothing more. Say so
# rather than inheriting the repository default, which may be wider.
permissions:
  contents: read

env:
  TASK_VERSION: v3.52.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: install task
        run: curl -sSfL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin "${TASK_VERSION}"

      - name: put tool bindir on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: install pinned tools
        run: task tools

      - name: check
        run: task check
