[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
goreleaser = "2.20.1"
"github:shinagawa-web/gomarklint" = "3.3.2"
typos = "1.52.2"
taplo = "0.10.0"
"go:github.com/google/go-licenses/v2" = "2.0.1"
cosign = "3.1.4"

[tasks.check]
description = "Check formatting, lint, spelling, licenses, and tests without editing files"
depends = [
  "check:go-format",
  "check:go-lint",
  "check:licenses",
  "check:markdown",
  "check:spelling",
  "check:toml-format",
  "check:toml",
  "test",
]

[tasks."check:go-format"]
description = "Check Go formatting without editing files"
run = """
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  printf 'Run mise run fmt:go to format:\\n%s\\n' "$unformatted"
  exit 1
fi
"""

[tasks."check:go-lint"]
description = "Lint Go code"
run = "golangci-lint run"

[tasks."check:licenses"]
description = "Check dependency licenses for all release targets"
run = """
set -e
for target in linux/amd64 linux/arm64 darwin/arm64; do
  echo "Checking dependency licenses for $target"
  GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
    go-licenses check --allowed_licenses=MIT,BSD-2-Clause,BSD-3-Clause,Apache-2.0,OFL-1.1 ./cmd/cress
done
"""

[tasks."check:markdown"]
description = "Lint Markdown and internal anchors"
run = "gomarklint"

[tasks."check:spelling"]
description = "Check spelling"
run = "typos"

[tasks."check:toml-format"]
description = "Check TOML formatting without editing files"
run = "taplo fmt --check"

[tasks."check:toml"]
description = "Validate TOML syntax"
run = "taplo check"

[tasks."check:goreleaser"]
description = "Validate GoReleaser configuration without building or publishing"
run = "goreleaser check"

[tasks.fmt]
description = "Format Go and TOML files"
depends = ["fmt:go", "fmt:toml"]

[tasks."fmt:go"]
description = "Format Go files"
run = "gofmt -w ."

[tasks."fmt:toml"]
description = "Format TOML files"
run = "taplo fmt"

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.build]
description = "Build the local executable in bin/"
run = "go build -o bin/cress ./cmd/cress"

[tasks."test:release"]
description = "Smoke-test packaged release archives without modifying dist/"
run = 'CRESS_RELEASE_DIR="${CRESS_RELEASE_DIR:-$PWD/dist}" go test -count=1 -timeout=5m -v ./internal/release'
