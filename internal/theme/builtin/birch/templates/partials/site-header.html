{{/*
  The masthead both layouts share. An empty [nav.main] drops the <nav> rather
  than leaving an empty landmark for a screen reader to announce.
*/}}
{{- define "site-header" -}}
  <header class="site-header">
      {{ template "brand" . }}
      {{- with .Nav.Main }}
      <nav class="site-nav">
        {{ range . }}<a href="{{ .URL }}"{{ if .Active }} aria-current="page"{{ end }}>{{ .Title }}</a>{{ end }}
      </nav>
      {{- end }}
    </header>
{{- end -}}
