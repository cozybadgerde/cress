#:schema https://raw.githubusercontent.com/cozybadgerde/cress/trunk/schema/theme.schema.json

name = "Orchid"
description = "Vivid and dark-first: a violet ground, a magenta-to-teal accent, loud on purpose."
author = "Cozy Badger"
license = "MIT"
homepage = "https://github.com/cozybadgerde/cress"

# No `cress` key, for the same reason the other built-in themes have none: a
# theme that ships inside the binary is always rendered by the contract it was
# written against, so the declaration could never catch a mismatch.
