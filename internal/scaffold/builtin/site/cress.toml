#:schema https://raw.githubusercontent.com/cozybadgerde/cress/trunk/schema/config.schema.json

[site]
title = "My cozy site"
description = "A fresh little site made with Cress."

# Where the site is published, path included: a project page lives at
# "https://user.github.io/my-site". Get this wrong and every link in the
# published site points one level too high.
base_url = "https://example.com"

# "cress" and "birch" ship in the binary. Drop your own under themes/<name> and
# name it here to swap.
theme = "cress"

# Branding. The shipped files are placeholders: replace static/logo.svg and
# static/favicon.png, or point these at your own.
logo = "/logo.svg"
# A second logo for readers who prefer a dark scheme. Only needed for artwork
# that suits one background; the placeholder holds up on both.
# logo_dark = "/logo-dark.svg"
favicon = "/favicon.png"

# The lead image a theme shows on any page that names none of its own. The
# caption is where a credit or an AI disclosure goes.
# image = "/social.webp"
# image_alt = "Cress growing in a wooden tray"
# image_caption = "AI-generated illustration."

# Accent color (hex). Left unset, the theme picks one per color scheme. Set both
# if yours only reads against one background.
# accent = "#4f7a4a"
# accent_dark = "#9ccb8f"

# Replaces the "Made with Cress" credit. Plain text only.
# footer = "A small corner of the internet."
# "{year}" becomes the year of the build; write one out for a fixed year.
# copyright = "(c) {year} My cozy site"

[markdown]
# Color the code in fenced blocks. Cress writes the tokens and the theme picks
# the colors, so a theme with no code styling renders exactly as it does now.
# highlight = true

# One table of "label = content file" per menu, in the order written. A label
# with spaces needs quoting, as TOML requires.
[nav.main]
Home = "index.md"
About = "about.md"
# A nested section: the content path of its index.md, not the URL.
Guides = "guides/index.md"

# Rendered in the footer. Both menus are optional.
[nav.footer]
Imprint = "imprint.md"
Privacy = "privacy.md"
