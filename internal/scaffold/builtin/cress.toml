#:schema https://raw.githubusercontent.com/cozybadgerde/cress/trunk/schema/config.schema.json

[site]
title = "My cozy site"
description = "A fresh little site made with Cress."
base_url = "https://example.com"
# The built-in theme. Drop a theme under themes/<name> and name it here to swap.
theme = "cress"

# White-label branding. Replace static/logo.png and static/favicon.png with
# your own, or point these at other files you drop in static/.
logo = "/logo.png"
favicon = "/favicon.png"
# Soft accent color (hex), used as a highlight on links and more.
accent = "#9cb43b"

# Navigation is explicit: one table of "label = content file" per menu, each
# rendered in the order written. A label with spaces is quoted, as TOML requires.
# The primary menu, rendered in the header.
[nav.main]
Home = "index.md"
About = "about.md"
"Style guide" = "styleguide.md"

# The secondary menu, rendered in the footer. Both groups are optional.
[nav.footer]
Imprint = "imprint.md"
Privacy = "privacy.md"
