#:schema https://raw.githubusercontent.com/cozybadgerde/cress/trunk/schema/config.schema.json

[site]
title = "My cozy site"
description = "A fresh little site made with Cress."
base_url = "https://example.com"
# The built-in theme. Drop a theme under themes/<name> and name it here to swap.
theme = "cress"

# White-label branding. Replace static/logo.png and static/favicon.png with
# your own, or point these at other files you drop in static/.
logo = "/logo.png"
favicon = "/favicon.png"
# Accent color (hex), used as a highlight on links and more. Left unset, the
# theme picks its own, including a variant for dark mode. Set accent_dark too if
# your color is only legible against one of the two backgrounds.
# accent = "#4f7a4a"
# accent_dark = "#9ccb8f"

# Footer message, replacing the "Made with Cress" credit. Plain text only.
# footer = "A small corner of the internet."
# Copyright notice. "{year}" becomes the year the site is built, so it never
# goes stale; write the year out yourself for a fixed one or a range.
# copyright = "(c) {year} My cozy site"

# Navigation is explicit: one table of "label = content file" per menu, each
# rendered in the order written. A label with spaces is quoted, as TOML requires.
# The primary menu, rendered in the header.
[nav.main]
Home = "index.md"
About = "about.md"
"Style guide" = "styleguide.md"

# The secondary menu, rendered in the footer. Both groups are optional.
[nav.footer]
Imprint = "imprint.md"
Privacy = "privacy.md"
