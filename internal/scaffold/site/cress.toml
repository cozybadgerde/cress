# Site settings. Every setting is optional unless noted; omitted ones use the
# default shown. To enable an example, remove the "# " from its table and
# fields together. Unknown settings produce a warning.

[site]
# Site name, shown in the header and browser tab. Each page still needs its
# own title.
title = "Your name"
# Default page description for search engines. A page can override it,
# or clear it with description = "".
description = "Who we are, what we do, and how to reach us."
# Footer line, shown as written. No year is added.
# copyright = "Copyright Your name"
# Site language, used for theme labels and screen readers. Built-in themes
# support "en" and "de". Content is not translated. Default: "en".
language = "en"
# Your public address, without a path. Set it before publishing to get
# canonical URLs, link previews, structured data, feeds, and sitemap.xml.
# Leave it out while unknown.
# host = "https://example.org"
# Set this when the site lives below a folder, such as "/site/". It must
# start and end with "/". Write all other URLs here and in your pages as if
# the site were at "/": Cress adds the prefix. Default: "/".
path = "/"

# Default title image for landing pages. A page's own [image] replaces it.
# Files in static/images/ are published at /images/.
# [site.image]
# src = "/images/team.jpg"
# alt = "Our team" # Describe the image, or use "" if it is decorative.
# caption = "Meet our team. [Photo credit](https://example.org/credits/)"
# focus = "top" # Part kept visible when cropped: center, top, bottom-left, ...

[theme]
# Built-in themes: "poppy" (default), "clover", or "anemone". A theme folder
# in themes/<name>/ is used instead, including one with a built-in name.
# Find more themes and installation instructions at:
# https://github.com/cozybadgerde/cress-themes
name = "poppy"

# Extra settings for a local theme. Built-in themes don't use any. Add only
# settings your theme documents.
# [theme.custom]

[navigation]
# Links in the order shown. Use published addresses such as "/about/", not
# file names, or full https:// links. Use [] to hide a group.
main = [
  { label = "Home", url = "/" },
  { label = "What we offer", url = "/offers/" },
  { label = "About", url = "/about/" },
  { label = "Journal", url = "/journal/list/" },
]
footer = [
  { label = "Contact", url = "/contact/" },
  { label = "Legal notice", url = "/legal-notice/" },
  { label = "Privacy", url = "/privacy/" },
  { label = "Content tour", url = "/tour/" },
]
# External link example: { label = "Partner", url = "https://example.org/" }

[syntax]
# Color code blocks by language. Set to false for plain code. Default: true.
highlight = true

[brand]
# Accent color for links and buttons, as "#" plus six hex digits. Cress warns
# below 4.5:1 contrast against white; check the result in your theme too.
# color = "#346b38"
# Browser tab icon.
favicon = "/images/favicon.svg"

# Logo shown beside the site title. Replace the gray placeholder in
# static/images/ before publishing. Square or round artwork fits best.
# Leave alt empty when the site title is shown, so it isn't read twice.
[brand.logo]
src = "/images/logo.svg"
alt = ""

[list]
# Entries per list page. Later pages get numbered URLs such as
# /journal/list/2/. A list page can override this; 0 shows every entry.
per_page = 3

# Who is behind the site, published on the home page as structured data for
# search engines. Needs [site] host. Fill in only what applies.
# [profile]
# Who is behind the site, as a type from https://schema.org/, such as
# "Person", "Organization", "NGO", "SportsClub", "LocalBusiness", or
# "Bakery". Default: "Organization".
# type = "Organization"
# name = "Your name" # Default: the site title.
# telephone = "+49 30 1234567"
# email = "hello@example.org"

# [profile.address]
# street = "Hauptstraße 1"
# postal_code = "10115"
# city = "Berlin"
# region = "Berlin"
# country = "DE"

# Opening hours, one table per set of days. Days: mo, tu, we, th, fr, sa, su.
# Times use 24 hours. A "Person" profile has no opening hours.
# [[profile.hours]]
# days = ["mo", "tu", "we", "th", "fr"]
# opens = "08:00"
# closes = "18:00"
